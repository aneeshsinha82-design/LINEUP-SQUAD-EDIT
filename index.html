<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LINEUP SQUAD EDIT</title>
<style>
:root{color-scheme:dark;--bg:#09120e;--panel:#14251c;--line:#34533e;--accent:#b9f477;--muted:#a7b8aa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f7f2;font:16px system-ui,Arial,sans-serif}
header{padding:24px max(18px,calc((100% - 1050px)/2));background:#102017;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:clamp(24px,4vw,36px);letter-spacing:1px}h1 span{color:var(--accent)}header p{margin:6px 0 0;color:var(--muted)}
main{max-width:1050px;margin:24px auto;padding:0 16px;display:grid;grid-template-columns:1.3fr .7fr;gap:18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
select,input,button{font:inherit;border-radius:9px;padding:10px;background:#0b1710;color:white;border:1px solid var(--line)}
button{cursor:pointer}button.primary{background:var(--accent);color:#14200d;font-weight:800;border-color:var(--accent)}
.pitch{background:repeating-linear-gradient(0deg,#23613c 0 68px,#1e5736 68px 136px);border:2px solid #b5d59c;border-radius:12px;padding:20px 8px;min-height:500px;display:flex;flex-direction:column;justify-content:space-around;gap:12px;position:relative}
.pitch:before{content:"";position:absolute;top:50%;left:0;right:0;border-top:2px solid #ffffff80}
.line{display:flex;justify-content:space-evenly;gap:4px;position:relative;z-index:1}
.slot{width:78px;min-height:80px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:2px}
.shirt{width:42px;height:42px;border-radius:12px;background:var(--accent);color:#14200d;display:grid;place-items:center;font-weight:900;border:2px solid white}
.slot small,.slot strong{text-shadow:0 1px 3px #000;font-size:11px}.slot strong{max-width:78px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fields{display:grid;gap:10px}.fields label{display:grid;gap:5px;color:var(--muted);font-size:13px}.fields input{width:100%}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.list{margin-top:16px;display:grid;gap:8px}.entry{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px;background:#0b1710;border:1px solid var(--line);border-radius:9px;font-size:13px}
.hint{color:var(--muted);font-size:13px}footer{text-align:center;padding:10px 16px 28px;color:var(--muted);font-size:12px}
@media(max-width:760px){main{grid-template-columns:1fr;margin:14px auto}.pitch{min-height:460px}.slot{width:66px}.shirt{width:36px;height:36px}}
</style>
</head>
<body>
<header><h1>LINEUP <span>SQUAD EDIT</span></h1><p>Build and save your FC-style starting XI.</p></header>
<main>
<section class="panel">
<div class="toolbar"><label for="formation">Formation</label><select id="formation"><option>4-3-3 Attack</option><option>4-3-3 Holding</option><option>4-2-3-1</option><option>4-4-2</option><option>3-5-2</option><option>4-1-2-1-2</option></select><button id="clear">Clear squad</button></div>
<div class="pitch" id="pitch" aria-label="Football formation pitch"></div>
<p class="hint">Select any shirt to edit that position.</p>
</section>
<aside class="panel">
<h2>Player editor</h2>
<div class="fields">
<label>Player name<input id="name" maxlength="24" placeholder="e.g. Mbappé"></label>
<label>Position<input id="role" maxlength="5" placeholder="ST"></label>
<label>Overall rating<input id="ovr" type="number" min="1" max="150" placeholder="100"></label>
<label>Card / club note<input id="note" maxlength="40" placeholder="Optional"></label>
</div>
<div class="actions"><button class="primary" id="save">Save player</button><button id="remove">Remove</button></div>
<div id="list" class="list"></div>
<p class="hint">Your squad saves automatically in this browser.</p>
</aside>
</main>
<footer>Independent fan-made squad planner. Not affiliated with EA SPORTS.</footer>
<script>
"use strict";
const formations={
"4-3-3 Attack":[["LW","ST","RW"],["CAM"],["CM","CM"],["LB","CB","CB","RB"],["GK"]],
"4-3-3 Holding":[["LW","ST","RW"],["CM","CDM","CM"],["LB","CB","CB","RB"],["GK"]],
"4-2-3-1":[["ST"],["LAM","CAM","RAM"],["CDM","CDM"],["LB","CB","CB","RB"],["GK"]],
"4-4-2":[["ST","ST"],["LM","CM","CM","RM"],["LB","CB","CB","RB"],["GK"]],
"3-5-2":[["ST","ST"],["LM","CM","CAM","CM","RM"],["CB","CB","CB"],["GK"]],
"4-1-2-1-2":[["ST","ST"],["CAM"],["CM","CM"],["CDM"],["LB","CB","CB","RB"],["GK"]]
};
const $=id=>document.getElementById(id);
let squad={};let selected=null;
try{squad=JSON.parse(localStorage.getItem("lineup-squad-edit")||"{}")||{}}catch{squad={}}
function saveStorage(){try{localStorage.setItem("lineup-squad-edit",JSON.stringify(squad))}catch{alert("Browser storage is unavailable. Your changes may not persist after closing this page.")}}
function escapeHTML(value){return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function draw(){
 const formation=$("formation").value;const pitch=$("pitch");pitch.innerHTML="";let n=0;
 formations[formation].forEach(row=>{const line=document.createElement("div");line.className="line";row.forEach(pos=>{const id=formation+"-"+n++;const p=squad[id]||{};const button=document.createElement("button");button.className="slot";button.type="button";button.innerHTML='<span class="shirt">'+escapeHTML(p.ovr||pos)+'</span><small>'+escapeHTML(pos)+'</small><strong>'+escapeHTML(p.name||"Tap to add")+'</strong>';button.addEventListener("click",()=>select(id,pos));line.appendChild(button)});pitch.appendChild(line)});
 renderList();
}
function select(id,pos){selected=id;const p=squad[id]||{};$("name").value=p.name||"";$("role").value=p.role||pos;$("ovr").value=p.ovr||"";$("note").value=p.note||""}
function renderList(){const list=$("list");const rows=Object.entries(squad).filter(([,p])=>p.name);list.innerHTML=rows.length?"":"<p class='hint'>No players added yet.</p>";rows.forEach(([id,p])=>{const row=document.createElement("div");row.className="entry";const label=document.createElement("span");label.textContent=p.name+" · "+(p.role||"POS")+(p.ovr?" · OVR "+p.ovr:"");const edit=document.createElement("button");edit.textContent="Edit";edit.addEventListener("click",()=>select(id,p.role));row.append(label,edit);list.appendChild(row)})}
$("save").addEventListener("click",()=>{if(!selected){alert("Select a position on the pitch first.");return}const name=$("name").value.trim();if(!name){alert("Enter a player name.");return}squad[selected]={name,role:$("role").value.trim().toUpperCase()||"POS",ovr:$("ovr").value,note:$("note").value.trim()};saveStorage();draw()});
$("remove").addEventListener("click",()=>{if(!selected)return;delete squad[selected];saveStorage();$("name").value=$("role").value=$("ovr").value=$("note").value="";draw()});
$("clear").addEventListener("click",()=>{if(confirm("Remove all players from your squad?")){squad={};selected=null;saveStorage();draw()}});
$("formation").addEventListener("change",()=>{selected=null;draw()});
draw();
</script>
</body>
</html>
